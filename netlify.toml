# Netlify build configuration — AI Study Suite PRO
#
# The app is a single self-contained index.html with no build step,
# so we publish the repository root as-is.

[build]
  publish = "."
  command = ""

# Make sure the service worker is never served stale.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
