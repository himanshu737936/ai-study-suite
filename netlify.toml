# Netlify build configuration — AI Study Suite PRO
#
# The app is a single self-contained index.html with no build step,
# so we publish the repository root as-is.
#
# Security + caching headers live in the `_headers` file (the canonical
# place for Netlify/Cloudflare Pages) — not duplicated here.

[build]
  publish = "."
  command = ""
