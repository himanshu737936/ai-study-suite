name: Build Android APK (TWA)

# Builds a signed Android APK from the PWA using Bubblewrap (Trusted Web Activity).
# Runs automatically when twa-manifest.json or this workflow changes, or manually
# from the Actions tab ("Run workflow").

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -1 "$ANDROID_HOME" 2>/dev/null || true
          echo "platforms:"; ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "build-tools:"; ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true
          # make sure Gradle/bubblewrap see the preinstalled SDK
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Show toolchain
        run: |
          java -version || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which bubblewrap || true
          bubblewrap help 2>&1 | head -25 || true
          # pre-accept any missing SDK licences so Gradle can auto-download components
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Expose sdkmanager where Bubblewrap expects it
        run: |
          # Bubblewrap validates the SDK by looking for <sdk>/tools or <sdk>/bin,
          # and resolves sdkmanager at <sdk>/bin/sdkmanager. Modern runner images
          # ship it under cmdline-tools/<version>/bin instead, so link it across.
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "found sdkmanager: $SDKMGR"
          sudo mkdir -p "$ANDROID_HOME/bin"
          sudo ln -sf "$SDKMGR" "$ANDROID_HOME/bin/sdkmanager"
          ls -la "$ANDROID_HOME/bin/"
          "$ANDROID_HOME/bin/sdkmanager" --version || true

      - name: Configure Bubblewrap (skip interactive JDK/SDK prompts)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Build signed APK
        timeout-minutes: 25
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'AiStudySuitePro2026' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'AiStudySuitePro2026' }}
        run: |
          bubblewrap build --skipPwaValidation

      - name: Show build outputs
        if: always()
        run: |
          echo "--- repo root ---"; ls -la
          echo "--- app dir ---"; ls -la app 2>/dev/null || true
          echo "--- apk outputs ---"; find . -name '*.apk' -o -name '*.aab' 2>/dev/null || true
          echo "--- apk details ---"
          for f in $(find . -name '*.apk' 2>/dev/null); do
            echo "$f"; ls -la "$f"
            (apksigner verify --print-certs "$f" 2>/dev/null || true) | head -8
          done

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-study-suite-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: warn

      - name: Publish APK to GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v11.0.0
          name: "AI Study Suite PRO — Android APK v11.0.0"
          body: |
            Signed Android APK of **AI Study Suite PRO v11.0**.

            - Works on Android 5.0+ (minSdk 21)
            - It is a **Trusted Web Activity** — it runs the real Chrome engine, so
              file upload, camera, voice answering, TTS and offline all work exactly
              like in Chrome.
            - Install: open the `.apk` on your phone and allow "Install unknown apps"
              for your browser/file manager.

            Made with ❤️ by Himanshu.
          files: |
            **/*.apk
            **/*.aab
          fail_on_unmatched_files: false
