name: Auto version bump

# Bumps the patch version on every push to main, so the app version always
# reflects the latest change. The version has ONE source of truth —
# <meta name="app-version"> in index.html — and this also syncs sw.js and the
# README badge. The commit it creates is tagged [skip version] so the job never
# loops. If several commits land at once, it re-reads the latest main and retries
# instead of failing on a non-fast-forward push.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - '_headers'
      - 'manifest.json'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump patch version and push (with retry)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            VER=$(python3 - <<'PY'
          import re, pathlib
          idx = pathlib.Path('index.html')
          s = idx.read_text(encoding='utf-8')
          m = re.search(r'<meta name="app-version" content="(\d+)\.(\d+)\.(\d+)">', s)
          if not m:
              raise SystemExit('app-version meta tag not found in index.html')
          ver = f'{m.group(1)}.{m.group(2)}.{int(m.group(3)) + 1}'
          s = re.sub(r'<meta name="app-version" content="\d+\.\d+\.\d+">',
                     f'<meta name="app-version" content="{ver}">', s, count=1)
          idx.write_text(s, encoding='utf-8')
          sw = pathlib.Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          sw.write_text(re.sub(r"const VERSION = '[^']*';", f"const VERSION = 'v{ver}';", t, count=1), encoding='utf-8')
          rm = pathlib.Path('README.md')
          if rm.exists():
              r = rm.read_text(encoding='utf-8')
              r = re.sub(r'> \*\*v\d+\.\d+\.\d+\*\* · Single-file app',
                         f'> **v{ver}** · Single-file app', r, count=1)
              rm.write_text(r, encoding='utf-8')
          print(ver)
          PY
          )
            git add index.html sw.js README.md
            if git diff --cached --quiet; then
              echo "nothing to bump"; exit 0
            fi
            git commit -q -m "chore: auto-bump version to v${VER} [skip version]"
            if git push -q origin main; then
              echo "pushed v${VER}"; exit 0
            fi
            echo "push race on attempt ${attempt} — retrying"
            sleep 5
          done
          echo "could not push after retries"; exit 1
