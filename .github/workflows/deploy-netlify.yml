name: Deploy to Netlify

# Deploys the site to Netlify on every push to main.
# Works even if Netlify's own GitHub webhook stops firing.
#
# Requires ONE repository secret:
#   NETLIFY_AUTH_TOKEN  — a Netlify personal access token
#                         (Netlify → User settings → Applications → New access token)
# If the secret is missing the workflow skips quietly instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NETLIFY_SITE_ID: b01ec0d3-42c0-432e-a727-8c9f81f1c4fb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for the Netlify token
        id: check
        run: |
          if [ -z "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::NETLIFY_AUTH_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage the site files
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p dist/.well-known
          for f in index.html manifest.json sw.js icon-192.png icon-512.png og-image.png robots.txt sitemap.xml _headers; do
            [ -f "$f" ] && cp "$f" dist/ && echo "staged $f"
          done
          [ -f .well-known/assetlinks.json ] && cp .well-known/assetlinks.json dist/.well-known/ && echo "staged .well-known/assetlinks.json"
          echo "--- dist ---"; ls -la dist

      - name: Deploy to Netlify
        if: steps.check.outputs.skip == 'false'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir dist \
            --site "$NETLIFY_SITE_ID" \
            --message "GitHub Actions: ${{ github.sha }}"
