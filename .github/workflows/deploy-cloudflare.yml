name: Deploy to Cloudflare Pages

# Deploys the site to Cloudflare Pages on every push to main.
# This bypasses the Cloudflare MCP connection entirely — it talks to
# Cloudflare directly from the GitHub runner.
#
# Requires TWO repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — API token with  Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID  — found in the Cloudflare dashboard right sidebar
#                            (or in the dashboard URL: dash.cloudflare.com/<account_id>)
#
# If the secrets are missing the workflow skips quietly instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CF_PROJECT: ai-study-suite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage the site files
        if: steps.check.outputs.skip == 'false'
        run: |
          mkdir -p dist/.well-known
          for f in index.html manifest.json sw.js icon-192.png icon-512.png og-image.png robots.txt sitemap.xml _headers; do
            [ -f "$f" ] && cp "$f" dist/ && echo "staged $f"
          done
          [ -f .well-known/assetlinks.json ] && cp .well-known/assetlinks.json dist/.well-known/ && echo "staged .well-known/assetlinks.json"
          echo "--- dist ---"; ls -la dist

      - name: Deploy to Cloudflare Pages
        if: steps.check.outputs.skip == 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name "$CF_PROJECT" \
            --branch main \
            --commit-dirty=true
